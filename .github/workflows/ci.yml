name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest]
        include:
          # The README promises Windows; test it (npm test must not rely on shell globbing).
          - node: 22
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # No API key in CI: every test uses a scripted or mock Jev, so nothing is billed.
      - run: npm test

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t jev-perfume-advisor .
      - name: Start in mock mode and check health
        run: |
          docker run -d --name app -p 8787:8787 jev-perfume-advisor
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          docker logs app
          exit 1
